{% extends "base.html" %}
{% block title %}Добавить вариант ответа{% endblock %}
{% block content %}
<div class="container mt-4">
    <h5>Вопрос: {{ question.text }}</h5>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Вариант ответа</label>
            <input type="text" name="text" class="form-control" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" name="is_correct" class="form-check-input" id="correct">
            <label class="form-check-label" for="correct">Правильный ответ</label>
        </div>
        <button type="submit" name="add_more" value="1" class="btn btn-primary">Добавить и ещё</button>
        <button type="submit" class="btn btn-success">Сохранить и вернуться</button>
        <a href="{{ url_for('teacher.lesson_test', lesson_id=question.test.lesson_id) }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
