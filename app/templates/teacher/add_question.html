{% extends "base.html" %}
{% block title %}Добавить вопрос{% endblock %}
{% block content %}
<div class="container mt-4">
    <h4>Добавление вопроса к тесту "{{ test.title }}"</h4>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Текст вопроса</label>
            <textarea name="text" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Тип вопроса</label>
            <select name="question_type" class="form-select">
                <option value="single_choice">Один правильный ответ</option>
                <option value="multiple_choice">Несколько правильных ответов</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Добавить вопрос</button>
        <a href="{{ url_for('teacher.lesson_test', lesson_id=lesson.id) }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
