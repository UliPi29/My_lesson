{% extends "base.html" %}
{% block title %}Создать курс{% endblock %}
{% block content %}
<h2>Создать курс</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
        {{ form.title.label(class="form-label") }}
        {{ form.title(class="form-control") }}
    </div>
    {{ form.submit(class="btn btn-primary") }}
    <a href="{{ url_for('teacher.my_courses') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
