{% extends "base.html" %}
{% block title %}Создать тест{% endblock %}
{% block content %}
<div class="container mt-4">
    <h4>Создание теста для урока "{{ lesson.title }}"</h4>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Название теста</label>
            <input type="text" name="title" class="form-control" value="Тест: {{ lesson.title }}" required>
        </div>
        <button type="submit" class="btn btn-success">Создать</button>
        <a href="{{ url_for('teacher.lesson_test', lesson_id=lesson.id) }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
