{% extends "base.html" %}

{% block title %}Управление уроком: {{ lesson.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>{{ lesson.title }}</h4>
        <a href="{{ url_for('teacher.course_lessons', course_id=lesson.course_id) }}" class="btn btn-sm btn-secondary">← К списку уроков</a>
    </div>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link {{ 'active' if active == 'materials' }}" href="{{ url_for('teacher.lesson_materials', lesson_id=lesson.id) }}">Материалы</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {{ 'active' if active == 'assignment' }}" href="{{ url_for('teacher.lesson_assignment', lesson_id=lesson.id) }}">Задание</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {{ 'active' if active == 'test' }}" href="{{ url_for('teacher.lesson_test', lesson_id=lesson.id) }}">Тест</a>
        </li>
    </ul>

    <div class="tab-content">
        {% block tab_content %}{% endblock %}
    </div>
</div>
{% endblock %}
